<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="/assests/css/style.css">
    <title>Document</title>
</head>

<body class="vh-100">
    <section class="w-75 m-auto h-75">
        <div id="carouselExampleDark" class="carousel h-100 carousel-overlay slide " data-bs-theme="dark" data-bs-ride="carousel"  data-bs-interval="300">
            <div class="carousel-inner h-100">
                <div class="carousel-item h-100 active" data-bs-interval="10000" data-bs-ride="carousel" data-bs-interval="300">
                    <img src="/assests/img/images (2).jpg" class="d-block object-fit-cover w-100 h-100 rounded-5" alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="/assests/img/0000b8.jpg" class="d-block w-100 object-fit-cover h-100 rounded-5" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="/assests/img/0000b8.jpg" class="d-block w-100 h-100 object-fit-cover rounded-5" alt="...">
                </div>
            </div>
            <div class="carousel-overlay-controls">
                <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                    data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                    data-bs-target="#carouselExampleDark" data-bs-slide="next">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </section>
</body>

</html>
